<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Dashboard - Screen Time Manager</title>
    <link rel="stylesheet" href="../../style.css">
</head>



<body>

    <header>
        <h1>Screen Time Manager</h1>
    </header>

    <main class="routines-page">

        <nav>
            <button onclick="window.location.href='../controls.html'">Controls</button>
            <button onclick="window.location.href='mainpage.html'">Routines</button>
            <button onclick="window.location.href='../setup.html'">Setup</button>
            <button type="button" data-logout>Log Out</button>
        </nav>

        <section>
            <h2>Daily Routines</h2>

            <div id="routine-list">

                <table>

                    <thead>

                        <tr>
                            <th>Routine Name</th>
                            <th>Status</th>
                        </tr>

                    </thead>
                    <tbody id="routine-table-body">
                        <!-- Routine rows will be dynamically added here, but for now let's hardcode some -->
                        <tr>
                            <td>Morning Routine</td>
                            <td><button id="isitactive" class="routine-status-green">Active</button></td>
                        </tr>

                        <tr>
                            <td>After School</td>
                            <td><button id="isitactive2" class="routine-status-red">Inactive</button></td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <div>
                <button class="create-routine-button" onclick="window.location.href='obligations.html'"> ➕Create Routine</button>
            </div>

        </section>

    </main>
    <script src="../../Javascripts/daily_routines.js"></script>
    <script src="../../Javascripts/login.js"></script>
</body>

</html>

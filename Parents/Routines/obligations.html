<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Parent Dashboard - Screen Time Manager - Configure 1: Obligations</title>
        <link rel="stylesheet" href="../../style.css">
        <script src="../../Javascripts/account-storage.js"></script>
        <script>requireRole("parent");</script>
    </head>

    <body>
        <header>
            <h1>
                <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="1" y="3" width="22" height="15" rx="2" fill="#ffffff"/><rect x="3" y="5" width="18" height="11" fill="#0b2545"/><rect x="10" y="18" width="4" height="3" fill="#ffffff"/><rect x="6" y="20" width="12" height="2" rx="1" fill="#ffffff"/></svg>
                Configure 1: Obligations
            </h1>
        </header>

        <main class="routine-step">
            <section>
                <h2>
                    Select Required Tasks:
                </h2>

                <div class="task-options">
                    <button id="isitSelected1" class="task-not-selected" aria-pressed="false"></button>   <!-- For this button, make it match to the database of tasks the user added-->
                    <button id="isitSelected2" class="task-not-selected" aria-pressed="false"></button>   <!-- For this button, make it match to the database of tasks the user added-->
                    <button id="isitSelected3" type="button" aria-disabled="true" aria-label="Add Custom Task, coming soon" data-tooltip="Coming soon">Add Custom Task</button>   <!-- Add some sort of popup to access the tasks database and have the user create some tasks. Oh, and add the crosshair button -->
                </div>

                <div class="routine-step-actions">
                    <button type="button" onclick="window.location.href='mainpage.html'">Back</button>
                    <button type="button" onclick="window.location.href='mainpage.html'">Back To Routines</button>
                    <button type="button" onclick="window.location.href='pair_rewards.html'">Next</button>
                </div>
            </section>
        </main>

        <script src="../../Javascripts/routine-task-selection.js"></script>
    </body>

</html>

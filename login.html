<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Screen Time Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>
            <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="1" y="3" width="22" height="15" rx="2" fill="#ffffff"/><rect x="3" y="5" width="18" height="11" fill="#0b2545"/><rect x="10" y="18" width="4" height="3" fill="#ffffff"/><rect x="6" y="20" width="12" height="2" rx="1" fill="#ffffff"/></svg>
            Screen Time Manager
        </h1>
    </header>

    <div class="login-container">
        <h2>Login</h2>

        <div class="login-options">
            <button id="parent-btn" class="active" type="button">Parent</button>
            <button id="child-btn" type="button">Child</button>
        </div>

        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required>

            <div id="password-container">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <p id="login-error" class="form-error hidden" role="alert"></p>

            <button type="submit" id="login-submit">Log In</button>
        </form>

        <p class="form-link">New here? <a href="signup.html">Create an account</a></p>
    </div>

    <script src="Javascripts/accounts.js"></script>
    <script src="Javascripts/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Dashboard - Screen Time Manager</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../Javascripts/accounts.js"></script>
    <script>requireRole("child");</script>
</head>
<body>
    <header>
        <h1>
            <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="1" y="3" width="22" height="15" rx="2" fill="#ffffff"/><rect x="3" y="5" width="18" height="11" fill="#0b2545"/><rect x="10" y="18" width="4" height="3" fill="#ffffff"/><rect x="6" y="20" width="12" height="2" rx="1" fill="#ffffff"/></svg>
            Screen Time Manager
        </h1>
    </header>
    <main>
        <nav>
            <button>Dashboard</button>
            <button>Routines</button>
            <button type="button" data-logout>Log Out</button>
        </nav>
        <section>
            <h2>My Screen Time</h2>
            <p>Remaining Time: 30 minutes</p>
            <p>Status: Locked</p>
        </section>
        <section>
            <h2>My Tasks</h2>
            <p>Homework: Completed</p>
            <p>Rewards Earned: See My Rewards below</p>
        </section>
        <section>
            <h2>My Rewards</h2>

            <p id="reward-message">
                No rewards available yet.
            </p>

            <div id="reward-content" class="hidden">
                <p id="reward-description"></p>

                <a id="reward-link"
                href="https://www.youtube.com/"
                target="_blank"
                rel="noopener noreferrer"
                class="hidden">
                    Open YouTube
                </a>
            </div>
        </section>
    </main>

    <script>
        const savedReward = localStorage.getItem("childReward");

        const rewardMessage = document.getElementById("reward-message");
        const rewardContent = document.getElementById("reward-content");
        const rewardDescription = document.getElementById("reward-description");
        const rewardLink = document.getElementById("reward-link");

        if (savedReward) {
            rewardMessage.textContent = "Your parent approved a reward!";
            rewardContent.classList.remove("hidden");

            if (savedReward === "Unlock app") {
                rewardDescription.textContent = "YouTube is now unlocked!";
                rewardLink.classList.remove("hidden");
            } else {
                rewardDescription.textContent =
                    `You received: ${savedReward}`;
            }
        }
    </script>

    <script src="../Javascripts/login.js"></script>
</body>
</html>
